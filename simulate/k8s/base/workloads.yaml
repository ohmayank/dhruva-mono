apiVersion: v1
kind: Service
metadata:
  name: simulator-store
spec:
  selector:
    app.kubernetes.io/name: simulator-store
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: simulator-store
spec:
  serviceName: simulator-store
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simulator-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simulator-store
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: store
          image: ko://simulator
          args: ["store"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aws-producer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aws-producer
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: producer
          image: ko://simulator
          args: ["producer"]
          envFrom: [{configMapRef: {name: simulator-profile}}]
          env:
            - {name: SOURCE, value: aws}
            - {name: INTERVAL, value: 1h}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minute-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minute-producer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minute-producer
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: producer
          image: ko://simulator
          args: ["producer"]
          envFrom: [{configMapRef: {name: simulator-profile}}]
          env:
            - {name: INTERVAL, value: 1m}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
