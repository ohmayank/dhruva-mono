apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: simulator-maitri
resources:
  - ../../base
configMapGenerator:
  - name: simulator-profile
    literals:
      - STATION=maitri
      - SOURCE=parsivel
      - SEED=maitri-v1
      - STORE_URL=http://simulator-store:8080
generatorOptions:
  disableNameSuffixHash: true
