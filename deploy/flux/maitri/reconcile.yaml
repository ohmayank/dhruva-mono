apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: maitri-workloads
  namespace: flux-system
spec:
  interval: 1m
  path: ./gitops/maitri
  prune: false
  serviceAccountName: maitri-flux-reconciler
  sourceRef:
    kind: GitRepository
    name: maitri-desired-state
  targetNamespace: simulator-maitri
  timeout: 2m
  wait: true
